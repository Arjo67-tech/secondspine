<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Second Spine Initiative</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel+Decorative:wght@400&family=Raleway:wght@200;300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #f0ebe0;
      --ink: #1a1612;
      --gold: #b89a5a;
      --muted: #7a6e5f;
      --accent: #c4a882;
    }

    html, body {
      height: 100%;
      background-color: var(--ink);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.35;
    }

    /* Radial glow */
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(ellipse at center, rgba(184,154,90,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* Top decorative line */
    .ornament {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards 0.2s;
    }

    .ornament-line {
      width: 80px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .ornament-line.right {
      background: linear-gradient(to left, transparent, var(--gold));
    }

    .ornament-diamond {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    .overline {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 1.2s ease forwards 0.5s;
      margin-bottom: 1.2rem;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 3.8rem);
      letter-spacing: 0.08em;
      line-height: 1.15;
      color: var(--cream);
      opacity: 0;
      animation: fadeUp 1.4s ease forwards 0.7s;
      margin-bottom: 2rem;
    }

    h1 span {
      display: block;
      color: var(--gold);
      font-size: 0.55em;
      letter-spacing: 0.25em;
      margin-top: 0.4em;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 0 auto 2rem;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards 1s;
    }

    .divider-line {
      width: 50px;
      height: 1px;
      background: var(--muted);
    }

    .divider-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--accent);
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards 1.2s;
      margin-bottom: 3.5rem;
    }

    .coming-soon {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 0.6rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 1.2s ease forwards 1.5s;
      border: 1px solid rgba(184,154,90,0.25);
      padding: 0.7rem 2rem;
    }

    /* Bottom ornament */
    .bottom-ornament {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards 1.8s;
    }

    .bottom-ornament span {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .small-diamond {
      width: 4px;
      height: 4px;
      background: var(--muted);
      transform: rotate(45deg);
      opacity: 0.5;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="ornament">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line right"></div>
    </div>

    <p class="overline">Est. 2026</p>

    <h1>
      Second Spine
      <span>Initiative</span>
    </h1>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-dot"></div>
      <div class="divider-line"></div>
    </div>

    <p class="tagline">Something is being built here.</p>

    <div class="coming-soon">Coming Soon</div>

  </div>

  <div class="bottom-ornament">
    <div class="small-diamond"></div>
    <span>secondspine.org</span>
    <div class="small-diamond"></div>
  </div>
</body>
</html>
